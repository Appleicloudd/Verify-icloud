<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in to iCloud</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white min-h-screen flex items-center justify-center p-4">

  <div class="max-w-sm w-full bg-zinc-900/90 border border-zinc-800 rounded-3xl p-8 shadow-2xl text-center space-y-6">
    
    <!-- Logo Apple / Tajuk -->
    <div class="space-y-3">
      <svg class="w-7 h-7 mx-auto text-white" viewBox="0 0 24 24" fill="currentColor">
        <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M14.97 6.35c.64-.78 1.08-1.86.96-2.95-.93.04-2.06.62-2.72 1.39-.58.68-1.1 1.77-.96 2.84 1.04.08 2.1-.5 2.72-1.28z"/>
      </svg>
      <h1 class="text-xl font-normal tracking-tight">Sign in to iCloud</h1>
    </div>

    <!-- Borang -->
    <form class="space-y-4 text-left">
      <div class="bg-zinc-800/50 border border-zinc-700/60 rounded-xl overflow-hidden divide-y divide-zinc-700/60">
        <input type="email" placeholder="Apple ID" class="w-full bg-transparent px-4 py-3.5 text-sm text-white placeholder-zinc-500 focus:outline-none">
        <input type="password" placeholder="Password" class="w-full bg-transparent px-4 py-3.5 text-sm text-white placeholder-zinc-500 focus:outline-none">
      </div>
      
      <button type="submit" class="w-full bg-white text-black font-medium py-3 rounded-xl hover:bg-zinc-200 transition text-sm">
        Sign In
      </button>
    </form>

    <div class="text-xs text-zinc-500 flex justify-between px-1">
      <a href="#" class="hover:underline">Forgot Apple ID or password?</a>
    </div>

  </div>

</body>
</html>
